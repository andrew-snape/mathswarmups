---
layout: activity
title: Hundreds Chart
emoji: 🔢
script: hundreds-chart.js
blurb: Click to highlight patterns, reveal skip-counting multiples, or hide the numbers.
strand: "Number, Algebra"
years: "F–6"
---
<div class="controls-bar hc-controls">
  <label class="field">
    Range
    <select id="hc-range">
      <option value="1" selected>1–100</option>
      <option value="101">101–200</option>
    </select>
  </label>
  <label class="checkbox-field">
    <input type="checkbox" id="hc-hide-numbers"> Hide numbers
  </label>
  <button class="btn" id="hc-clear" type="button">↺ Clear</button>
  <span class="hint" style="margin:0;">Skip count:</span>
  <div class="btn-group" id="hc-skip-buttons"></div>
</div>

<div class="stage" id="hc-stage">
  <div class="hundred-grid" id="hc-grid"></div>
</div>

<p class="hint">Click any cell to highlight it, or pick a skip-count to reveal its pattern.</p>

<style>
[data-page="hundreds-chart"] .activity-main {
  gap: 0.75rem;
  padding-top: 0.75rem;
  padding-bottom: 0.75rem;
}
.hc-controls {
  padding: 0.5rem var(--space-3);
  row-gap: 0.4rem;
}
#hc-stage {
  padding: 0.75rem;
}
.hundred-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 0.35rem;
  width: 600px;
  max-width: 100%;
  aspect-ratio: 1;
  margin: 0 auto;
}
.hundred-cell {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--panel-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: clamp(0.65rem, 2.2vmin, 1.15rem);
  font-weight: 700;
  color: var(--text);
  cursor: pointer;
  transition: background 0.1s ease, transform 0.1s ease;
  user-select: none;
}
.hundred-cell:hover {
  border-color: var(--accent-2);
}
.hundred-cell:active {
  transform: scale(0.93);
}
.hundred-cell.highlight {
  background: var(--accent-fill);
  color: #1a1400;
  border-color: var(--accent-fill);
}
.hundred-cell.hidden-number {
  color: transparent;
}
</style>
